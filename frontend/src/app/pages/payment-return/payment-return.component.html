<div class="min-h-[60vh] flex items-center justify-center px-4">
  <div class="card max-w-sm w-full text-center py-10">
    <!-- Processing -->
    <div *ngIf="isProcessing" class="space-y-4">
      <svg class="animate-spin h-10 w-10 text-primary-600 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <h2 class="text-lg font-semibold text-gray-900">Processing Payment...</h2>
      <p class="text-sm text-gray-500">Please wait while we confirm your payment.</p>
    </div>

    <!-- Error -->
    <div *ngIf="error" class="space-y-4">
      <div class="w-14 h-14 bg-red-50 rounded-2xl flex items-center justify-center mx-auto">
        <svg class="w-7 h-7 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </div>
      <h2 class="text-lg font-semibold text-gray-900">Payment Failed</h2>
      <p class="text-sm text-gray-500">{{ error }}</p>
      <button (click)="router.navigate(['/quote'])" class="btn-primary w-full mt-4 text-sm">
        Return to Quote Form
      </button>
    </div>

    <!-- Success -->
    <div *ngIf="!isProcessing && !error" class="space-y-4">
      <div class="w-14 h-14 bg-primary-50 rounded-2xl flex items-center justify-center mx-auto animate-pulse-once">
        <svg class="w-7 h-7 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
      <h2 class="text-lg font-semibold text-gray-900">Payment Successful!</h2>
      <p class="text-sm text-gray-500">Redirecting to WhatsApp...</p>
    </div>
  </div>
</div>
