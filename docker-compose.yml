version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: unsullied-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: unsullied
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unsullied-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: unsullied
      DB_USER: postgres
      DB_PASSWORD: postgres
      NODE_ENV: production
      WHATSAPP_PHONE: ${WHATSAPP_PHONE:-27123456789}
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unsullied-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
